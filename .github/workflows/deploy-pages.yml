name: Deploy · GitHub Pages self-hosted

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: office-language-doctor-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy on DESKTOP-0NEP6ON
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        shell: powershell

    steps:
      - name: Verify approved local runner
        run: |
          Write-Host "Runner: $env:RUNNER_NAME / Host: $env:COMPUTERNAME"
          if ($env:RUNNER_NAME -ne 'DESKTOP-0NEP6ON') {
            throw "Unexpected runner: $env:RUNNER_NAME"
          }
          if ($env:COMPUTERNAME -ne 'DESKTOP-0NEP6ON') {
            throw "Unexpected host: $env:COMPUTERNAME"
          }

      - name: Checkout
        uses: actions/checkout@v5

      - name: Enforce local runners
        run: ./scripts/check-local-runners.ps1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Verify build output and custom domain
        run: |
          if (-not (Test-Path "dist\index.html")) {
            throw "dist/index.html was not generated"
          }
          if (-not (Test-Path "dist\CNAME")) {
            throw "dist/CNAME was not generated"
          }
          $cname = (Get-Content "dist\CNAME" -Raw).Trim()
          if ($cname -ne 'language-doctor.cecolab.cat') {
            throw "Unexpected CNAME: $cname"
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
