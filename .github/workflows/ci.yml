name: CI · local Windows

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-language-doctor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on DESKTOP-0NEP6ON
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    defaults:
      run:
        shell: powershell

    steps:
      - name: Verify approved local runner
        run: |
          Write-Host "Runner: $env:RUNNER_NAME / Host: $env:COMPUTERNAME"
          if ($env:RUNNER_NAME -ne 'DESKTOP-0NEP6ON') {
            throw "Unexpected runner: $env:RUNNER_NAME"
          }
          if ($env:COMPUTERNAME -ne 'DESKTOP-0NEP6ON') {
            throw "Unexpected host: $env:COMPUTERNAME"
          }

      - name: Checkout
        uses: actions/checkout@v5

      - name: Enforce local runners
        shell: powershell
        run: ./scripts/check-local-runners.ps1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Check PowerPoint XML patcher
        run: npm run check:xml

      - name: Check language detector
        run: npm run check:detector

      - name: Check neighboring-language duels
        run: npm run check:language-duels

      - name: Check ambiguous fragment safety
        run: npm run check:ambiguity

      - name: Check real-world Office fragment corpus
        run: npm run check:office-corpus

      - name: Check synthetic full-document corpus
        run: npm run check:document-corpus

      - name: Check Smart Fix on full documents
        run: npm run check:smart-document

      - name: Check Word scan and repair
        run: npm run check:docx

      - name: Check OpenDocument scan and repair
        run: npm run check:odf

      - name: Check format variants and macro preservation
        run: npm run check:variants

      - name: Check Smart Fix safety policy
        run: npm run check:smart-fix

      - name: Check missing proofing-tag repair
        run: npm run check:missing-tags

      - name: Check fragment diagnostics labels
        run: npm run check:diagnostics

      - name: Check interface localization
        run: npm run check:i18n

      - name: Check localized document errors
        run: npm run check:user-errors

      - name: Check cooperative large-document scheduling
        run: npm run check:cooperative-scan

      - name: Check paragraph-aware audit grouping
        run: npm run check:paragraph-audit

      - name: Check audit session scale and repair follow-up
        run: npm run check:audit-session

      - name: Check local audit report exports
        run: npm run check:report

      - name: Check RTF scan and repair
        run: npm run check:rtf

      - name: Check public landing page
        run: npm run check:public-ui

      - name: Build
        run: npm run build
